services:
  command-mcp:
    build: .
    environment:
      COMMAND_MCP_HOST: 0.0.0.0
      COMMAND_MCP_PORT: 8000
      COMMAND_MCP_API_KEY: ${COMMAND_MCP_API_KEY:?set COMMAND_MCP_API_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

